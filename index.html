<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tatilim sepette</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --booked-color: #fee2e2;
      --available-color: #dcfce7;
      --booked-border: #fca5a5;
      --available-border: #86efac;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }

    header { text-align: center; margin-bottom: 20px; }
    header h1 { color: #0f172a; margin-bottom: 8px; }

    .search-bar { max-width: 800px; margin: 0 auto 30px auto; background: white; padding: 15px 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; gap: 15px; align-items: center; justify-content: center; flex-wrap: wrap; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .search-group { display: flex; flex-direction: column; gap: 4px; }
    .search-group label { font-size: 0.85rem; font-weight: bold; color: #475569; }
    .search-group input { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.95rem; }
    .btn-search { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; align-self: flex-end; }
    .btn-search:hover { background: #1d4ed8; }
    .btn-reset { padding: 10px 15px; background: #64748b; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; align-self: flex-end; }

    .villa-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .villa-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .villa-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    .img-container { width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background-color: #cbd5e1; }
    .img-container img { width: 100%; height: 100%; object-fit: cover; }
    .card-info { padding: 16px; text-align: center; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-content { background: white; border-radius: 16px; max-width: 750px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; padding: 24px; }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; border: none; background: none; color: #64748b; }

    .slider { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 20px; cursor: zoom-in; }
    .slider img { width: 100%; height: 100%; object-fit: cover; }
    .slider-nav { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; transform: translateY(-50%); padding: 0 10px; }
    .slider-btn { background: rgba(255,255,255,0.8); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 18px; }
    .photo-counter { position: absolute; bottom: 10px; right: 12px; background: rgba(0, 0, 0, 0.6); color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; }
    .zoom-hint { position: absolute; top: 10px; left: 12px; background: rgba(0,0,0,0.5); color: white; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; }

    /* Tam Ekran Lightbox (Büyük Fotoğraf Modu) */
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 2000; justify-content: center; align-items: center; }
    .lightbox.active { display: flex; }
    .lightbox-img { max-width: 90vw; max-height: 85vh; object-fit: contain; border-radius: 6px; }
    .lightbox-close { position: absolute; top: 20px; right: 25px; color: white; font-size: 35px; cursor: pointer; font-weight: bold; }
    .lightbox-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); color: white; border: none; font-size: 30px; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; }
    .lightbox-btn:hover { background: rgba(255,255,255,0.4); }
    .lightbox-btn.prev { left: 20px; }
    .lightbox-btn.next { right: 20px; }

    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
    .month-select { padding: 6px 12px; font-size: 1rem; border-radius: 6px; border: 1px solid var(--border); background: #f8fafc; font-weight: bold; color: var(--primary); }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .day-header { font-weight: bold; font-size: 0.8rem; color: #64748b; padding-bottom: 4px; }
    
    /* Takvim Hücre Stilleri */
    .day-cell { 
      border: 1px solid var(--border); 
      border-radius: 6px; 
      padding: 6px 2px; 
      background: #f1f5f9; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      min-height: 54px; 
      position: relative;
      overflow: hidden;
    }
    .day-cell.empty { background: transparent; border: none; }
    .day-cell.available { background: var(--available-color); border-color: var(--available-border); }
    .day-cell.booked { background: var(--booked-color); border-color: var(--booked-border); }
    .day-cell.past { background: #e2e8f0; border-color: #cbd5e1; color: #94a3b8; opacity: 0.6; }

    /* Çapraz Bölünmüş Günler (Çıkış/Giriş) */
    .day-cell.split-checkout-checkin {
      background: linear-gradient(135deg, var(--booked-color) 0%, var(--booked-color) 49%, #cbd5e1 50%, var(--available-color) 51%, var(--available-color) 100%) !important;
      border-color: #94a3b8;
    }
    .day-cell.split-checkout-only {
      background: linear-gradient(135deg, var(--booked-color) 0%, var(--booked-color) 49%, #cbd5e1 50%, #ffffff 51%, #ffffff 100%) !important;
    }
    .day-cell.split-checkin-only {
      background: linear-gradient(135deg, #ffffff 0%, #ffffff 49%, #cbd5e1 50%, var(--booked-color) 51%, var(--booked-color) 100%) !important;
    }

    .day-num { font-weight: bold; font-size: 0.8rem; z-index: 2; text-align: left; padding-left: 2px; }
    .day-price { font-size: 0.68rem; color: #15803d; margin-top: 2px; font-weight: 600; z-index: 2; text-align: right; padding-right: 2px; }
    .booked .day-price { color: #991b1b; }

    /* Lejant (Takvim Altı Bilgilendirme) */
    .calendar-legend { display: flex; gap: 12px; margin-top: 12px; font-size: 0.75rem; color: #64748b; flex-wrap: wrap; justify-content: center; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-box { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border); }
  </style>
</head>
<body>

  <header>
    <h1 id="siteTitle">CIKA VİLALARI</h1>
    <p id="siteSubtitle">Tarihlerinizi seçerek müsait villaları arayın veya kartlara tıklayarak detayları inceleyin.</p>
  </header>

  <div class="search-bar">
    <div class="search-group">
      <label>Giriş Tarihi:</label>
      <input type="date" id="checkIn">
    </div>
    <div class="search-group">
      <label>Çıkış Tarihi:</label>
      <input type="date" id="checkOut">
    </div>
    <button class="btn-search" onclick="filterVillas()">Müsait Villaları Ara</button>
    <button class="btn-reset" onclick="resetFilter()">Tümünü Göster</button>
  </div>

  <div class="villa-grid" id="villaGrid"></div>

  <!-- Detay Modalı -->
  <div class="modal" id="villaModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <h2 id="modalTitle" style="margin-bottom: 15px;">Villa Detayı</h2>
      
      <div class="slider" onclick="openLightbox()">
        <span class="zoom-hint">🔍 Büyütmek için tıklayın</span>
        <img id="sliderImg" src="" alt="Villa Fotoğrafı">
        <div class="slider-nav">
          <button class="slider-btn" onclick="event.stopPropagation(); prevImage();">&#10094;</button>
          <button class="slider-btn" onclick="event.stopPropagation(); nextImage();">&#10095;</button>
        </div>
        <div class="photo-counter" id="photoCounter">1 / 1</div>
      </div>

      <div class="calendar-header">
        <h3>Müsaitlik ve Fiyat Takvimi</h3>
        <select id="monthSelect" class="month-select" onchange="renderCalendar()">
          <option value="0">Ocak</option>
          <option value="1">Şubat</option>
          <option value="2">Mart</option>
          <option value="3">Nisan</option>
          <option value="4">Mayıs</option>
          <option value="5">Haziran</option>
          <option value="6">Temmuz</option>
          <option value="7">Ağustos</option>
          <option value="8">Eylül</option>
          <option value="9">Ekim</option>
          <option value="10">Kasım</option>
          <option value="11">Aralık</option>
        </select>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>

      <div class="calendar-legend">
        <div class="legend-item"><div class="legend-box" style="background: var(--available-color);"></div> Müsait</div>
        <div class="legend-item"><div class="legend-box" style="background: var(--booked-color);"></div> Dolu</div>
        <div class="legend-item"><div class="legend-box" style="background: linear-gradient(135deg, var(--booked-color) 50%, var(--available-color) 50%);"></div> Aynı Gün Çıkış / Giriş (Çapraz)</div>
      </div>
    </div>
  </div>

  <!-- Tam Ekran Fotoğraf Galerisi (Lightbox) -->
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
    <button class="lightbox-btn prev" onclick="prevImage()">&#10094;</button>
    <img id="lightboxImg" class="lightbox-img" src="" alt="Büyük Fotoğraf">
    <button class="lightbox-btn next" onclick="nextImage()">&#10095;</button>
  </div>

  <script>
    const SUPABASE_URL = "https://kpiguuorrjwtavglspse.supabase.co";
    const SUPABASE_KEY = "sb_publishable_msm-5EXXHX6CiShmkDJx2A_pdbzkvio";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let villas = [];
    let activeVilla = null;
    let currentImageIndex = 0;

    async function loadSiteHeader() {
      const { data } = await _supabase.from('site_settings').select('*').eq('id', 1).single();
      if (data) {
        if (data.title) document.getElementById('siteTitle').innerText = data.title;
        if (data.subtitle) document.getElementById('siteSubtitle').innerText = data.subtitle;
      }
    }

    async function loadVillas() {
      const { data, error } = await _supabase.from('villas').select('*');
      if (error) return console.error(error);
      villas = data || [];
      renderVillaGrid(villas);
    }

    function renderVillaGrid(listToRender) {
      const grid = document.getElementById('villaGrid');
      grid.innerHTML = '';

      if (listToRender.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #64748b; font-size: 1.1rem; padding: 40px;">Aradığınız tarihler arasında müsait villa bulunamadı.</div>`;
        return;
      }

      listToRender.forEach(v => {
        const card = document.createElement('div');
        card.className = 'villa-card';
        card.onclick = () => openModal(v.id);
        const imgUrl = (v.images && v.images.length > 0) ? v.images[0] : 'https://via.placeholder.com/600x450';
        card.innerHTML = `
          <div class="img-container">
            <img src="${imgUrl}" alt="${v.name}">
          </div>
          <div class="card-info">
            <h3>${v.name}</h3>
            <p>${v.tagline || ''}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Bir günün müsaitlik durumunu sorgulayan yardımcı fonksiyon
    function isDayAvailable(villa, month, day) {
      const monthData = villa.prices ? villa.prices[month] : null;
      if (monthData && monthData.customDays && monthData.customDays[day] !== undefined) {
        return monthData.customDays[day].available !== false;
      }
      return true; // Varsayılan olarak müsait
    }

    function filterVillas() {
      const checkInVal = document.getElementById('checkIn').value;
      const checkOutVal = document.getElementById('checkOut').value;

      if (!checkInVal || !checkOutVal) {
        alert("Lütfen hem giriş hem çıkış tarihini seçin.");
        return;
      }

      const start = new Date(checkInVal);
      const end = new Date(checkOutVal);

      if (start >= end) {
        alert("Çıkış tarihi giriş tarihinden sonra olmalıdır.");
        return;
      }

      const availableVillas = villas.filter(v => {
        let cur = new Date(start);
        // Çıkış günü hariç (öğleden sonra çıkacağı için) konaklanacak günlerin kontrolü
        while (cur < end) {
          const m = cur.getMonth();
          const d = cur.getDate();

          if (!isDayAvailable(v, m, d)) {
            return false;
          }
          cur.setDate(cur.getDate() + 1);
        }
        return true;
      });

      renderVillaGrid(availableVillas);
    }

    function resetFilter() {
      document.getElementById('checkIn').value = "";
      document.getElementById('checkOut').value = "";
      renderVillaGrid(villas);
    }

    function openModal(id) {
      activeVilla = villas.find(v => v.id === id);
      currentImageIndex = 0;
      document.getElementById('modalTitle').innerText = activeVilla.name;
      document.getElementById('monthSelect').value = new Date().getMonth();
      
      updateSlider();
      renderCalendar();
      document.getElementById('villaModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('villaModal').classList.remove('active');
    }

    function updateSlider() {
      if (!activeVilla.images || activeVilla.images.length === 0) return;
      const currentUrl = activeVilla.images[currentImageIndex];
      document.getElementById('sliderImg').src = currentUrl;
      document.getElementById('lightboxImg').src = currentUrl;
      document.getElementById('photoCounter').innerText = `${currentImageIndex + 1} / ${activeVilla.images.length}`;
    }

    function nextImage() {
      if (!activeVilla.images || !activeVilla.images.length) return;
      currentImageIndex = (currentImageIndex + 1) % activeVilla.images.length;
      updateSlider();
    }

    function prevImage() {
      if (!activeVilla.images || !activeVilla.images.length) return;
      currentImageIndex = (currentImageIndex - 1 + activeVilla.images.length) % activeVilla.images.length;
      updateSlider();
    }

    function openLightbox() {
      if (!activeVilla.images || !activeVilla.images.length) return;
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    document.addEventListener('keydown', function(e) {
      const isLightboxActive = document.getElementById('lightbox').classList.contains('active');
      if (isLightboxActive) {
        if (e.key === 'ArrowRight') nextImage();
        if (e.key === 'ArrowLeft') prevImage();
        if (e.key === 'Escape') closeLightbox();
      }
    });

    function renderCalendar() {
      const calGrid = document.getElementById('calendarGrid');
      calGrid.innerHTML = '';

      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth();
      const currentDay = now.getDate();
      const selectedMonthIndex = parseInt(document.getElementById('monthSelect').value);

      const days = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
      days.forEach(d => {
        const h = document.createElement('div');
        h.className = 'day-header';
        h.innerText = d;
        calGrid.appendChild(h);
      });

      const totalDays = new Date(currentYear, selectedMonthIndex + 1, 0).getDate();
      let firstDayIndex = new Date(currentYear, selectedMonthIndex, 1).getDay();
      firstDayIndex = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty';
        calGrid.appendChild(emptyCell);
      }

      const monthPrices = (activeVilla.prices && activeVilla.prices[selectedMonthIndex]) ? activeVilla.prices[selectedMonthIndex] : { defaultPrice: "-", customDays: {} };

      for (let day = 1; day <= totalDays; day++) {
        let isPast = (selectedMonthIndex < currentMonth) || (selectedMonthIndex === currentMonth && day < currentDay);
        
        const customInfo = monthPrices.customDays ? monthPrices.customDays[day] : null;
        const price = customInfo ? customInfo.price : (monthPrices.defaultPrice || "Fiyat Yok");
        const available = isDayAvailable(activeVilla, selectedMonthIndex, day);

        // Önceki ve sonraki günlerin durumunu analiz et
        const prevDayAvailable = day > 1 ? isDayAvailable(activeVilla, selectedMonthIndex, day - 1) : true;
        const nextDayAvailable = day < totalDays ? isDayAvailable(activeVilla, selectedMonthIndex, day + 1) : true;

        const cell = document.createElement('div');
        
        if (isPast) {
          cell.className = 'day-cell past';
          cell.innerHTML = `<span class="day-num">${day}</span><span class="day-price">Geçti</span>`;
        } else {
          // Çapraz Gün Kontrolleri (Split-day logic)
          // 1. Önceki gün dolu, bugün boşsa -> Sabah Çıkış, Öğleden sonra Boş
          const isCheckoutDay = !prevDayAvailable && available;
          // 2. Bugün boş, sonraki gün doluysa -> Sabah Boş, Öğleden sonra Giriş
          const isCheckinDay = available && !nextDayAvailable;

          if (isCheckoutDay && isCheckinDay) {
            // Hem çıkış hem giriş aynı güne sıkışıyorsa
            cell.className = 'day-cell split-checkout-checkin';
            cell.innerHTML = `<span class="day-num">${day}</span><span class="day-price">${price}</span>`;
          } else if (isCheckoutDay) {
            cell.className = 'day-cell split-checkout-only';
            cell.innerHTML = `<span class="day-num">${day}</span><span class="day-price">${price}</span>`;
          } else if (!available) {
            cell.className = 'day-cell booked';
            cell.innerHTML = `<span class="day-num">${day}</span><span class="day-price">Dolu</span>`;
          } else {
            cell.className = 'day-cell available';
            cell.innerHTML = `<span class="day-num">${day}</span><span class="day-price">${price}</span>`;
          }
        }
        calGrid.appendChild(cell);
      }
    }

    loadSiteHeader();
    loadVillas();
  </script>
</body>
</html>
