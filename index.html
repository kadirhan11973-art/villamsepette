<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tatilim Sepette - Villa Kiralama</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --booked-color: #fee2e2;
      --available-color: #dcfce7;
      --pending-color: #e2e8f0; /* Opsiyonlu / Beklemede Rengi (Soluk Gri) */
      --selected-color: #93c5fd;
      --selected-border: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }

    header { text-align: center; margin-bottom: 25px; }
    header h1 { color: #0f172a; margin-bottom: 6px; }

    .villa-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .villa-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; cursor: pointer; transition: transform 0.2s; }
    .villa-card:hover { transform: translateY(-4px); }
    .img-container { width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background-color: #cbd5e1; }
    .img-container img { width: 100%; height: 100%; object-fit: cover; }
    .card-info { padding: 16px; text-align: center; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-content { background: white; border-radius: 16px; max-width: 750px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; padding: 24px; }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; border: none; background: none; }

    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
    .month-select { padding: 6px 12px; font-size: 1rem; border-radius: 6px; border: 1px solid var(--border); font-weight: bold; color: var(--primary); }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .day-header { font-weight: bold; font-size: 0.8rem; color: #64748b; }

    .day-cell { 
      border: 1px solid var(--border); border-radius: 6px; padding: 6px 2px; background: #f1f5f9; 
      display: flex; flex-direction: column; justify-content: space-between; min-height: 54px; position: relative; overflow: hidden; cursor: pointer; user-select: none;
    }
    .day-cell.available { background: var(--available-color); border-color: #86efac; }
    .day-cell.booked { background: var(--booked-color); border-color: #fca5a5; cursor: not-allowed; }
    
    /* Beklemede / Opsiyonlu Gün Stili (Soluk Gri) */
    .day-cell.pending-day {
      background: var(--pending-color) !important;
      border-color: #cbd5e1 !important;
      color: #64748b;
    }

    /* Çapraz Çıkış Günü */
    .day-cell.split-checkout {
      background: linear-gradient(135deg, var(--booked-color) 0%, var(--booked-color) 49%, #cbd5e1 50%, var(--available-color) 51%, var(--available-color) 100%) !important;
    }
    .day-cell.selected { background: var(--selected-color) !important; border-color: var(--selected-border) !important; }
    .day-cell.selected-checkout {
      background: linear-gradient(135deg, var(--selected-color) 0%, var(--selected-color) 49%, #cbd5e1 50%, #ffffff 51%, #ffffff 100%) !important;
    }

    .day-num { font-weight: bold; font-size: 0.8rem; text-align: left; padding-left: 2px; z-index: 2; }
    .day-price { font-size: 0.68rem; color: #15803d; text-align: right; font-weight: 600; z-index: 2; }

    .booking-section { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 20px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .form-grid input { padding: 9px 12px; border-radius: 6px; border: 1px solid var(--border); width: 100%; }
    .btn-submit { width: 100%; padding: 12px; background: #25d366; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    .btn-submit:hover { background: #128c7e; }

    .calendar-legend { display: flex; gap: 10px; margin-top: 10px; font-size: 0.75rem; color: #64748b; flex-wrap: wrap; justify-content: center; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-box { width: 12px; height: 12px; border-radius: 2px; border: 1px solid var(--border); }
  </style>
</head>
<body>

  <header>
    <h1 id="siteTitle">CIKA VİLLALARI</h1>
    <p id="siteSubtitle">Tarihlerinizi seçerek rezervasyon talebinizi iletebilirsiniz.</p>
  </header>

  <div class="villa-grid" id="villaGrid"></div>

  <!-- Detay Modalı -->
  <div class="modal" id="villaModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <h2 id="modalTitle" style="margin-bottom: 15px;">Villa Detayı</h2>

      <div class="calendar-header">
        <h3>Müsaitlik Takvimi</h3>
        <select id="monthSelect" class="month-select" onchange="renderCalendar()">
          <option value="0">Ocak</option><option value="1">Şubat</option><option value="2">Mart</option>
          <option value="3">Nisan</option><option value="4">Mayıs</option><option value="5">Haziran</option>
          <option value="6">Temmuz</option><option value="7">Ağustos</option><option value="8">Eylül</option>
          <option value="9">Ekim</option><option value="10">Kasım</option><option value="11">Aralık</option>
        </select>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>

      <div class="calendar-legend">
        <div class="legend-item"><div class="legend-box" style="background: var(--available-color);"></div> Müsait</div>
        <div class="legend-item"><div class="legend-box" style="background: var(--pending-color);"></div> Opsiyonlu (Beklemede)</div>
        <div class="legend-item"><div class="legend-box" style="background: var(--booked-color);"></div> Dolu</div>
      </div>

      <!-- Rezervasyon Formu -->
      <div class="booking-section">
        <h4 style="margin-bottom:10px;">Rezervasyon Talebi Oluştur</h4>
        <div class="form-grid">
          <input type="text" id="guestName" placeholder="Adınız Soyadınız">
          <input type="tel" id="guestPhone" placeholder="Telefon Numarası (05XX...)">
          <input type="email" id="guestEmail" placeholder="E-Posta Adresi" style="grid-column: span 2;">
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-weight:bold; background:#e2e8f0; padding:10px; border-radius:6px;">
          <span>Tarihler: <span id="selectedDatesText" style="font-weight:normal; color:#475569;">Takvimden seçin</span></span>
          <span>Toplam Tutar: <span id="totalPriceText" style="color:var(--primary);">-</span></span>
        </div>
        <button class="btn-submit" onclick="submitReservation()">WhatsApp ile Talep Gönder</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://kpiguuorrjwtavglspse.supabase.co";
    const SUPABASE_KEY = "sb_publishable_msm-5EXXHX6CiShmkDJx2A_pdbzkvio";
    const MY_WHATSAPP_NUMBER = "905332016490"; 

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let villas = [];
    let reservations = [];
    let activeVilla = null;
    let selectedStartDate = null;
    let selectedEndDate = null;

    async function init() {
      await loadSiteHeader();
      await loadVillas();
      await loadReservations();
    }

    async function loadSiteHeader() {
      const { data } = await _supabase.from('site_settings').select('*').eq('id', 1).single();
      if (data) {
        if (data.title) document.getElementById('siteTitle').innerText = data.title;
        if (data.subtitle) document.getElementById('siteSubtitle').innerText = data.subtitle;
      }
    }

    async function loadVillas() {
      const { data } = await _supabase.from('villas').select('*');
      villas = data || [];
      renderVillaGrid();
    }

    async function loadReservations() {
      const { data } = await _supabase.from('reservations').select('*').neq('status', 'Reddedildi');
      reservations = data || [];
    }

    function renderVillaGrid() {
      const grid = document.getElementById('villaGrid');
      grid.innerHTML = '';
      villas.forEach(v => {
        const card = document.createElement('div');
        card.className = 'villa-card';
        card.onclick = () => openModal(v.id);
        const imgUrl = (v.images && v.images.length > 0) ? v.images[0] : 'https://via.placeholder.com/600x450';
        card.innerHTML = `
          <div class="img-container"><img src="${imgUrl}" alt="${v.name}"></div>
          <div class="card-info"><h3>${v.name}</h3><p>${v.tagline || ''}</p></div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(id) {
      activeVilla = villas.find(v => v.id === id);
      selectedStartDate = null;
      selectedEndDate = null;
      document.getElementById('modalTitle').innerText = activeVilla.name;
      document.getElementById('monthSelect').value = new Date().getMonth();
      document.getElementById('guestName').value = "";
      document.getElementById('guestPhone').value = "";
      document.getElementById('guestEmail').value = "";
      document.getElementById('selectedDatesText').innerText = "Takvimden seçin";
      document.getElementById('totalPriceText').innerText = "-";
      
      renderCalendar();
      document.getElementById('villaModal').classList.add('active');
    }

    function closeModal() { document.getElementById('villaModal').classList.remove('active'); }

    function getDayReservationStatus(year, monthIndex, day) {
      const dateStr = `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      let isApprovedStay = false, isApprovedCheckout = false, isPendingStay = false;

      const activeRes = reservations.filter(r => r.villa_id == activeVilla.id);
      
      activeRes.forEach(r => {
        if (r.status === 'Onaylandı') {
          if (dateStr >= r.check_in && dateStr < r.check_out) isApprovedStay = true;
          if (dateStr === r.check_out) isApprovedCheckout = true;
        } else if (r.status === 'Beklemede') {
          if (dateStr >= r.check_in && dateStr <= r.check_out) isPendingStay = true;
        }
      });

      return { isApprovedStay, isApprovedCheckout, isPendingStay };
    }

    function renderCalendar() {
      const calGrid = document.getElementById('calendarGrid');
      calGrid.innerHTML = '';

      const currentYear = new Date().getFullYear();
      const selectedMonthIndex = parseInt(document.getElementById('monthSelect').value);

      const days = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
      days.forEach(d => {
        const h = document.createElement('div');
        h.className = 'day-header';
        h.innerText = d;
        calGrid.appendChild(h);
      });

      const totalDays = new Date(currentYear, selectedMonthIndex + 1, 0).getDate();
      let firstDayIndex = new Date(currentYear, selectedMonthIndex, 1).getDay();
      firstDayIndex = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty';
        calGrid.appendChild(emptyCell);
      }

      const monthPrices = (activeVilla.prices && activeVilla.prices[selectedMonthIndex]) ? activeVilla.prices[selectedMonthIndex] : { defaultPrice: "-", customDays: {} };

      for (let day = 1; day <= totalDays; day++) {
        const thisDate = new Date(currentYear, selectedMonthIndex, day);
        const customInfo = monthPrices.customDays ? monthPrices.customDays[day] : null;
        const priceStr = customInfo ? customInfo.price : (monthPrices.defaultPrice || "Fiyat Yok");
        const manualAvailable = customInfo ? customInfo.available : true;

        const { isApprovedStay, isApprovedCheckout, isPendingStay } = getDayReservationStatus(currentYear, selectedMonthIndex, day);

        const cell = document.createElement('div');
        let classes = ['day-cell'];

        if (isApprovedCheckout && !isApprovedStay) {
          classes.push('split-checkout');
        } else if (isApprovedStay || !manualAvailable) {
          classes.push('booked');
        } else if (isPendingStay) {
          classes.push('pending-day');
        } else {
          classes.push('available');
        }

        let isStay = false, isCheckout = false;
        if (selectedStartDate && !selectedEndDate) {
          if (thisDate.getTime() === selectedStartDate.getTime()) isStay = true;
        } else if (selectedStartDate && selectedEndDate) {
          if (thisDate >= selectedStartDate && thisDate < selectedEndDate) isStay = true;
          if (thisDate.getTime() === selectedEndDate.getTime()) isCheckout = true;
        }

        if (isStay) classes.push('selected');
        if (isCheckout) classes.push('selected-checkout');

        cell.className = classes.join(' ');
        
        let labelPrice = priceStr;
        if (isPendingStay && !isApprovedStay) labelPrice = "Opsiyonlu";
        if (isApprovedStay) labelPrice = "Dolu";

        cell.innerHTML = `<span class="day-num">${day}</span><span class="day-price">${labelPrice}</span>`;

        if (!isApprovedStay) {
          cell.onclick = () => handleDateClick(currentYear, selectedMonthIndex, day);
        }

        calGrid.appendChild(cell);
      }
    }

    function getDayPriceNumber(villa, month, day) {
      const monthPrices = villa.prices ? villa.prices[month] : null;
      if (!monthPrices) return 0;
      const customInfo = monthPrices.customDays ? monthPrices.customDays[day] : null;
      const priceStr = customInfo ? customInfo.price : (monthPrices.defaultPrice || "0");
      const num = parseInt(priceStr.toString().replace(/[^0-9]/g, ''));
      return isNaN(num) ? 0 : num;
    }

    function handleDateClick(year, month, day) {
      const clicked = new Date(year, month, day);

      if (!selectedStartDate || (selectedStartDate && selectedEndDate)) {
        selectedStartDate = clicked;
        selectedEndDate = null;
      } else {
        if (clicked > selectedStartDate) {
          selectedEndDate = clicked;
        } else {
          selectedStartDate = clicked;
          selectedEndDate = null;
        }
      }

      const formatDate = (d) => `${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear()}`;
      const datesText = document.getElementById('selectedDatesText');
      const priceText = document.getElementById('totalPriceText');

      if (selectedStartDate && selectedEndDate) {
        datesText.innerText = `${formatDate(selectedStartDate)} - ${formatDate(selectedEndDate)} (Öğlen Çıkış)`;
        
        let total = 0;
        let cur = new Date(selectedStartDate);
        while (cur < selectedEndDate) {
          total += getDayPriceNumber(activeVilla, cur.getMonth(), cur.getDate());
          cur.setDate(cur.getDate() + 1);
        }
        priceText.innerText = total.toLocaleString('tr-TR') + " TL";
      } else if (selectedStartDate) {
        datesText.innerText = `${formatDate(selectedStartDate)} (Çıkış Seçin)`;
        priceText.innerText = "-";
      }

      renderCalendar();
    }

    async function submitReservation() {
      const name = document.getElementById('guestName').value.trim();
      const phone = document.getElementById('guestPhone').value.trim();
      const email = document.getElementById('guestEmail').value.trim();

      if (!selectedStartDate || !selectedEndDate) return alert("Lütfen takvimden giriş ve çıkış tarihini seçin.");
      if (!name || !phone) return alert("Lütfen ad, soyad ve telefon bilgilerinizi eksiksiz yazın.");

      const formatDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      const inStr = formatDate(selectedStartDate);
      const outStr = formatDate(selectedEndDate);
      const totalPriceStr = document.getElementById('totalPriceText').innerText;

      const { error } = await _supabase.from('reservations').insert([{
        villa_id: activeVilla.id,
        villa_name: activeVilla.name,
        guest_name: name,
        guest_phone: phone,
        guest_email: email,
        check_in: inStr,
        check_out: outStr,
        total_price: totalPriceStr,
        status: 'Beklemede',
        created_at: new Date().toISOString()
      }]);

      if (error) {
        alert("Kaydedilirken hata oluştu: " + error.message);
        return;
      }

      const msg = `Merhaba, ${activeVilla.name} için yeni rezervasyon talebim var:%0A%0A` +
                  `👤 *Müşteri:* ${name}%0A` +
                  `📞 *Telefon:* ${phone}%0A` +
                  `✉️ *E-Posta:* ${email || '-'}%0A` +
                  `📅 *Giriş Tarihi:* ${inStr}%0A` +
                  `📅 *Çıkış Tarihi:* ${outStr} (Öğlen)%0A` +
                  `💰 *Hesaplanan Tutar:* ${totalPriceStr}`;

      window.open(`https://wa.me/${MY_WHATSAPP_NUMBER}?text=${msg}`, '_blank');
      closeModal();
      alert("Talebiniz iletildi! Yöneticimiz inceleyip dönüş yapacaktır.");
      await loadReservations();
      renderCalendar();
    }

    init();
  </script>
</body>
</html>
