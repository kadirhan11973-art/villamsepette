    <script>
        const SUPABASE_URL = "https://kpiguuorrjwtavglspse.supabase.co";
        const SUPABASE_KEY = "sb_publishable_msm-5EXXHX6CiShmkDJx2A_pdbzkvio";
        const MY_WHATSAPP_NUMBER = "905332016490"; 

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let villas = [];
        let reservations = [];
        let activeVilla = null;
        let activePhotoIndex = 0;
        let selectedStartDate = null;
        let selectedEndDate = null;
        let searchStart = null;
        let searchEnd = null;

        const monthNames = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];

        async function init() {
            await loadSiteHeader();

            flatpickr("#doubleDateRangePicker", {

                    if (selectedDates.length === 2) {
                        searchStart = selectedDates[0];

            });

            checkUrlHash();

        async function loadSiteHeader() {
            const { data } = await _supabase.from('site_settings').select('*').eq('id', 1).single();
            if (data) {
                if (data.title) {
                    document.getElementById('siteTitle').innerText = data.title;
                    document.getElementById('siteTitleTag').innerText = data.title;
                }
                if (data.subtitle) document.getElementById('siteSubtitle').innerText = data.subtitle;
                if (data.favicon) document.getElementById('siteFavicon').href = data.favicon;
                if (data.banner1) {
                    const b1 = document.getElementById('siteBanner1');
                    b1.src = data.banner1;
                    b1.style.display = 'block';
                }
            }
        }

        async function loadVillas() {
            const { data } = await _supabase.from('villas').select('*');
            villas = data || [];
            renderVillaGrid(villas, 'villaGrid');
            renderVillaGrid(villas, 'allVillaGrid');
        }

        async function loadReservations() {
            const { data } = await _supabase.from('reservations').select('*').neq('status', 'Reddedildi');
            reservations = data || [];
        }

        /* 🛡️ KORUMALI & DİNAMİK VİLLA KART DÖNGÜSÜ */
        function renderVillaGrid(list, containerId) {
            const grid = document.getElementById(containerId);
            if (!grid) return;
            grid.innerHTML = '';
            if (!list || list.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 30px; background:white; border-radius:12px; color:#64748b; font-weight:bold;">Müsait villa bulunamadı.</div>';
                return;
            }
            list.forEach(v => {
                const card = document.createElement('div');
                card.className = 'v-card';
                card.onclick = () => openDetailPage(v.id);
                
                // Fotoğraf kontrolü (Eğer resim eksikse veya boşsa çökmez)
                const imgUrl = (v.images && Array.isArray(v.images) && v.images.length > 0 && v.images[0]) 
                    ? v.images[0] 
                    : 'https://images.unsplash.com/photo-1580587771525-78b9dba3b914?auto=format&fit=crop&w=600&q=80';
                
                // Admin panelinden kaydedilen varsayılan kart fiyatını okur
                const displayCardPrice = (v.default_night_price && String(v.default_night_price).trim() !== '') 
                    ? v.default_night_price 
                    : 'Fiyat Sorun';

                card.innerHTML = `
                    <div class="v-card-img">
                        <span class="v-badge-location"><i class="fa-solid fa-location-dot"></i> Kaş / Kalkan</span>
                        <img src="${imgUrl}" alt="${v.name || 'Villa'}" onerror="this.src='https://images.unsplash.com/photo-1580587771525-78b9dba3b914?auto=format&fit=crop&w=600&q=80';">
                    </div>
                    <div class="v-card-body">
                        <h3 class="v-title">${v.name || 'İsimsiz Villa'}</h3>
                        <p class="v-tagline">${v.tagline || 'Özel havuzlu lüks tatil villası.'}</p>
                        <div class="v-card-footer">
                            <div>
                                <span style="font-size:0.7rem; color:var(--text-sub);">Gecelik</span>
                                <div class="v-price-val">${displayCardPrice} TL</div>
                            </div>
                            <button class="btn-card-detail">İncele</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.page-tab').forEach(el => el.classList.remove('active-tab'));
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active-tab');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function checkUrlHash() {
            const hash = window.location.hash;
            if (hash && hash.startsWith('#teklif')) {
                const paramString = hash.includes('?') ? hash.split('?')[1] : '';
                const params = new URLSearchParams(paramString);
                const vId = params.get('v');
                const inDateStr = params.get('in');
                const outDateStr = params.get('out');
                if (vId && inDateStr && outDateStr) openVIPOfferPage(vId, inDateStr, outDateStr);
                return;
            }
            if (hash && hash.startsWith('#villa-')) {
                const vId = parseInt(hash.replace('#villa-', ''));
                if (vId) openDetailPage(vId);
            }
        }

        function openVIPOfferPage(villaId, checkInStr, checkOutStr) {
            const targetVilla = villas.find(v => String(v.id) === String(villaId));
            if (!targetVilla) return;
            openDetailPage(targetVilla.id);

            const dIn = new Date(checkInStr);
            const dOut = new Date(checkOutStr);
            selectedStartDate = dIn;
            selectedEndDate = dOut;

            let total = 0;
            let cur = new Date(dIn);
            while (cur < dOut) {
                total += getDayPriceNumber(targetVilla, cur.getMonth(), cur.getDate());
                cur.setDate(cur.getDate() + 1);
            }

            const formatDateStr = (d) => `${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear()}`;
            document.getElementById('selectedDatesText').innerText = `${formatDateStr(dIn)} - ${formatDateStr(dOut)}`;
            document.getElementById('totalPriceText').innerText = total.toLocaleString('tr-TR') + " TL";
            document.getElementById('detailLocation').innerText = "SİZE ÖZEL VIP TEKLİF";
            document.getElementById('monthSelect').value = dIn.getMonth();
            renderCalendar();
        }

        function openDetailPage(id) {
            activeVilla = villas.find(v => String(v.id) === String(id));
            if (!activeVilla) return;

            activePhotoIndex = 0;
            selectedStartDate = null;
            selectedEndDate = null;
            
            document.getElementById('detailTitle').innerText = activeVilla.name;
            document.getElementById('detailLocation').innerText = "KAŞ / KALKAN";
            document.getElementById('monthSelect').value = new Date().getMonth();
            document.getElementById('guestName').value = "";
            document.getElementById('guestPhone').value = "";
            document.getElementById('guestEmail').value = "";
            document.getElementById('selectedDatesText').innerText = "Takvimden seçin";
            document.getElementById('totalPriceText').innerText = "-";
            
            updateFrontSlider();
            renderCalendar();

            document.getElementById('villaDetailPage').classList.add('active');
            document.body.style.overflow = 'hidden';
            window.location.hash = `#villa-${activeVilla.id}`;
        }

        function closeDetailPage() {
            document.getElementById('villaDetailPage').classList.remove('active');
            document.body.style.overflow = 'auto';
            history.pushState("", document.title, window.location.pathname + window.location.search);
        }

        function copyShareLink() {
            const url = `${window.location.origin}${window.location.pathname}#villa-${activeVilla.id}`;
            navigator.clipboard.writeText(url);
            alert("Bağlantı kopyalandı!");
        }

        function updateFrontSlider() {
            const imgElem = document.getElementById('frontSliderImg');
            const counterElem = document.getElementById('frontSliderCounter');
            if (!activeVilla.images || activeVilla.images.length === 0) {
                imgElem.src = 'https://via.placeholder.com/600x450';
                counterElem.innerText = '0 / 0';
                return;
            }
            imgElem.src = activeVilla.images[activePhotoIndex];
            counterElem.innerText = `${activePhotoIndex + 1} / ${activeVilla.images.length}`;
        }

        function nextFrontImg() {
            if (!activeVilla.images || !activeVilla.images.length) return;
            activePhotoIndex = (activePhotoIndex + 1) % activeVilla.images.length;
            updateFrontSlider();
        }

        function prevFrontImg() {
            if (!activeVilla.images || !activeVilla.images.length) return;
            activePhotoIndex = (activePhotoIndex - 1 + activeVilla.images.length) % activeVilla.images.length;
            updateFrontSlider();
        }

        function getDayReservationStatus(villaId, year, monthIndex, day) {
            const dateStr = `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            let isApprovedStay = false, isApprovedCheckout = false;
            const activeRes = reservations.filter(r => r.villa_id == villaId);
            
            activeRes.forEach(r => {
                if (r.status === 'Onaylandı') {
                    if (dateStr >= r.check_in && dateStr < r.check_out) isApprovedStay = true;
                    if (dateStr === r.check_out) isApprovedCheckout = true;
                }
            });
            return { isApprovedStay, isApprovedCheckout };
        }

        function renderCalendar() {
            const calGrid = document.getElementById('calendarGrid');
            calGrid.innerHTML = '';
            const currentYear = new Date().getFullYear();
            const selectedMonthIndex = parseInt(document.getElementById('monthSelect').value);
            const today = new Date(); today.setHours(0,0,0,0);

            const days = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
            days.forEach(d => {
                const h = document.createElement('div');
                h.className = 'day-header';
                h.innerText = d;
                calGrid.appendChild(h);
            });

            const totalDays = new Date(currentYear, selectedMonthIndex + 1, 0).getDate();
            let firstDayIndex = new Date(currentYear, selectedMonthIndex, 1).getDay();
            firstDayIndex = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

            for (let i = 0; i < firstDayIndex; i++) calGrid.appendChild(document.createElement('div'));

            const monthPrices = (activeVilla.prices && activeVilla.prices[selectedMonthIndex]) ? activeVilla.prices[selectedMonthIndex] : { defaultPrice: "-", customDays: {} };

            for (let day = 1; day <= totalDays; day++) {
                const thisDate = new Date(currentYear, selectedMonthIndex, day);
                thisDate.setHours(0,0,0,0);
                const isPast = thisDate < today;

                const customInfo = monthPrices.customDays ? monthPrices.customDays[day] : null;
                const priceStr = customInfo ? customInfo.price : (activeVilla.default_night_price || monthPrices.defaultPrice || "Fiyat Yok");
                const manualAvailable = customInfo ? customInfo.available : true;
                const { isApprovedStay, isApprovedCheckout } = getDayReservationStatus(activeVilla.id, currentYear, selectedMonthIndex, day);

                const cell = document.createElement('div');
                let classes = ['day-cell'];

                if (isPast) classes.push('booked');
                else if (isApprovedStay || !manualAvailable) classes.push('booked');
                else classes.push('available');

                if (selectedStartDate && selectedEndDate) {
                    if (thisDate.getTime() === selectedStartDate.getTime() || thisDate.getTime() === selectedEndDate.getTime() || (thisDate > selectedStartDate && thisDate < selectedEndDate)) {
                        classes.push('selected');
                    }
                } else if (selectedStartDate && thisDate.getTime() === selectedStartDate.getTime()) {
                    classes.push('selected');
                }

                cell.className = classes.join(' ');
                cell.innerHTML = `<span class="day-num">${day}</span><span class="day-price">${isApprovedStay ? 'Dolu' : priceStr}</span>`;

                if (!isPast && !isApprovedStay && manualAvailable) {
                    cell.onclick = () => handleDateClick(currentYear, selectedMonthIndex, day);
                }
                calGrid.appendChild(cell);
            }
        }

        function handleDateClick(year, month, day) {
            const clicked = new Date(year, month, day);
            if (!selectedStartDate || (selectedStartDate && selectedEndDate)) {
                selectedStartDate = clicked;
                selectedEndDate = null;
            } else {
                if (clicked > selectedStartDate) selectedEndDate = clicked;
                else { selectedStartDate = clicked; selectedEndDate = null; }
            }

            const formatDate = (d) => `${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear()}`;
            if (selectedStartDate && selectedEndDate) {
                document.getElementById('selectedDatesText').innerText = `${formatDate(selectedStartDate)} - ${formatDate(selectedEndDate)}`;
                let total = 0, cur = new Date(selectedStartDate);
                while (cur < selectedEndDate) {
                    total += getDayPriceNumber(activeVilla, cur.getMonth(), cur.getDate());
                    cur.setDate(cur.getDate() + 1);
                }
                document.getElementById('totalPriceText').innerText = total.toLocaleString('tr-TR') + " TL";
            } else if (selectedStartDate) {
                document.getElementById('selectedDatesText').innerText = `${formatDate(selectedStartDate)} (Çıkış seçin)`;
            }
            renderCalendar();
        }

        function getDayPriceNumber(villa, month, day) {
            const monthPrices = villa.prices ? villa.prices[month] : null;
            let priceStr = "0";
            if (monthPrices) {
                const customInfo = monthPrices.customDays ? monthPrices.customDays[day] : null;
                priceStr = customInfo ? customInfo.price : (villa.default_night_price || monthPrices.defaultPrice || "0");
            } else {
                priceStr = villa.default_night_price || "0";
            }
            const num = parseInt(priceStr.toString().replace(/[^0-9]/g, ''));
            return isNaN(num) ? 0 : num;
        }

        function filterAvailableVillas() {
            if (!searchStart || !searchEnd) return alert("Lütfen tarih seçin.");
            const sInStr = `${searchStart.getFullYear()}-${String(searchStart.getMonth() + 1).padStart(2, '0')}-${String(searchStart.getDate()).padStart(2, '0')}`;
            const sOutStr = `${searchEnd.getFullYear()}-${String(searchEnd.getMonth() + 1).padStart(2, '0')}-${String(searchEnd.getDate()).padStart(2, '0')}`;

            const availableList = villas.filter(v => {
                return !reservations.some(r => r.villa_id == v.id && r.status === 'Onaylandı' && (sInStr < r.check_out && sOutStr > r.check_in));
            });
            renderVillaGrid(availableList, 'villaGrid');
        }

        function resetSearchFilter() {
            searchStart = null; searchEnd = null;
            renderVillaGrid(villas, 'villaGrid');
        }

        async function submitReservation() {
            const name = document.getElementById('guestName').value.trim();
            const phone = document.getElementById('guestPhone').value.trim();
            if (!selectedStartDate || !selectedEndDate || !name || !phone) return alert("Lütfen tüm alanları doldurun.");

            const inStr = `${selectedStartDate.getFullYear()}-${String(selectedStartDate.getMonth() + 1).padStart(2, '0')}-${String(selectedStartDate.getDate()).padStart(2, '0')}`;
            const outStr = `${selectedEndDate.getFullYear()}-${String(selectedEndDate.getMonth() + 1).padStart(2, '0')}-${String(selectedEndDate.getDate()).padStart(2, '0')}`;
            const totalPriceStr = document.getElementById('totalPriceText').innerText;

            await _supabase.from('reservations').insert([{
                villa_id: activeVilla.id, villa_name: activeVilla.name,
                guest_name: name, guest_phone: phone,
                check_in: inStr, check_out: outStr,
                total_price: totalPriceStr, status: 'Beklemede'
            }]);

            const msg = `Merhaba, ${activeVilla.name} için rezervasyon talebi:%0A👤 ${name}%0A📞 ${phone}%0A📅 ${inStr} - ${outStr}%0A💰 ${totalPriceStr}`;
            window.open(`https://wa.me/${MY_WHATSAPP_NUMBER}?text=${msg}`, '_blank');
            closeDetailPage();
            alert("Talebiniz iletildi!");
        }

        init();
    </script>
