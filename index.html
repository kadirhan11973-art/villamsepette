<!DOCTYPE html>
<html lang="tr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kadirhan Cika | tatilimsepette.com</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff6ee; /* Hafif turuncumsu arka fon */
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Üst Turuncu Bar */
        .top-bar {
            background: linear-gradient(135deg, #ff7a00, #e65100);
            color: #ffffff;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(230, 81, 0, 0.2);
        }

        .top-bar h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .top-bar .subtitle {
            font-size: 1.1rem;
            font-weight: 500;
            opacity: 0.95;
        }

        /* Ana İçerik Alanı */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 35px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 122, 0, 0.08);
            border: 1px solid rgba(255, 122, 0, 0.15);
        }

        .card h2 {
            color: #d84315;
            font-size: 1.4rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* İletişim ve WhatsApp Alanı */
        .contact-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: #f4fbf7;
            border: 2px solid #25d366;
            padding: 14px 24px;
            border-radius: 50px;
            text-decoration: none;
            color: #075e54;
            font-size: 1.2rem;
            font-weight: 700;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.15);
        }

        .contact-box:hover {
            transform: translateY(-2px);
            background-color: #e8f7ee;
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.25);
        }

        .whatsapp-icon {
            width: 32px;
            height: 32px;
            fill: #25d366;
            flex-shrink: 0;
        }

        .phone-text {
            letter-spacing: 0.5px;
        }

        .note {
            margin-top: 18px;
            font-size: 0.9rem;
            color: #777777;
        }
    </style>
</head>
